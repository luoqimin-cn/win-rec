name: Build Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg (静态编译版，支持 WASAPI)
        uses: AnimMouse/setup-ffmpeg@v1
        with:
          version: release

      - name: 获取并验证 ffmpeg 路径
        id: ffmpeg
        shell: pwsh
        run: |
          $ff = (Get-Command ffmpeg).Source
          $fp = (Get-Command ffprobe).Source
          Write-Host "ffmpeg: $ff"
          Write-Host "ffprobe: $fp"
          $size = (Get-Item $ff).Length
          Write-Host "ffmpeg size: $size bytes"
          if ($size -lt 10MB) { throw "ffmpeg 文件过小（$size 字节），可能是 shim，不是静态编译版" }
          $devices = & ffmpeg -devices 2>&1 | Out-String
          if ($devices -notmatch "dshow") { throw "ffmpeg 不支持 dshow，无法在 Windows 录音" }
          Write-Host "ffmpeg dshow 验证通过"
          echo "path=$ff" >> $env:GITHUB_OUTPUT
          echo "probe=$fp" >> $env:GITHUB_OUTPUT

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build recorder subprocess (onefile，含 ffmpeg)
        shell: pwsh
        run: |
          pyinstaller `
            --onefile `
            --name win-rec-recorder `
            --console `
            --noconfirm `
            "--add-binary=${{ steps.ffmpeg.outputs.path }};." `
            "--add-binary=${{ steps.ffmpeg.outputs.probe }};." `
            win_rec\recorder_win.py

      - name: Build main exe (onedir)
        shell: pwsh
        run: |
          pyinstaller `
            --onedir `
            --name win-rec `
            --console `
            --noconfirm `
            "--add-binary=${{ steps.ffmpeg.outputs.path }};." `
            "--add-binary=${{ steps.ffmpeg.outputs.probe }};." `
            --add-data "win_rec;win_rec" `
            --hidden-import win_rec.cli `
            --hidden-import win_rec.recorder `
            --hidden-import win_rec.recorder_win `
            --hidden-import win_rec.transcribe `
            --hidden-import win_rec.summarize `
            --hidden-import win_rec.refine `
            --hidden-import win_rec.store `
            --hidden-import win_rec.config `
            --hidden-import win_rec.glossary `
            --hidden-import win_rec.diarize `
            --hidden-import typer `
            --hidden-import rich `
            --hidden-import faster_whisper `
            --hidden-import ctranslate2 `
            --hidden-import anthropic `
            --hidden-import openai `
            --hidden-import filelock `
            --hidden-import send2trash `
            --hidden-import pydub `
            --hidden-import mutagen `
            --hidden-import yaml `
            --collect-all faster_whisper `
            --collect-all ctranslate2 `
            --collect-all silero_vad `
            main.py

      - name: Build tray exe (onefile, noconsole)
        shell: pwsh
        run: |
          pyinstaller `
            --onefile `
            --name tray `
            --noconsole `
            --noconfirm `
            --hidden-import win_rec.tray `
            --hidden-import win_rec.config `
            --hidden-import win_rec.store `
            --hidden-import pystray `
            --hidden-import PIL `
            tray_main.py

      - name: 整理输出目录
        shell: cmd
        run: |
          copy /y dist\win-rec-recorder.exe dist\win-rec\win-rec-recorder.exe
          copy /y dist\tray.exe dist\win-rec\tray.exe

      - name: 验证 ffmpeg 已打包进 _internal\
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\win-rec\_internal\ffmpeg.exe")) {
            throw "dist\win-rec\_internal\ffmpeg.exe 不存在，ffmpeg 未正确打包！"
          }
          if (-not (Test-Path "dist\win-rec\_internal\ffprobe.exe")) {
            throw "dist\win-rec\_internal\ffprobe.exe 不存在，ffprobe 未正确打包！"
          }
          $size = (Get-Item "dist\win-rec\_internal\ffmpeg.exe").Length
          Write-Host "打包后 ffmpeg 大小：$size 字节"
          if ($size -lt 10MB) { throw "打包后的 ffmpeg 过小，可能带入了 shim" }
          Write-Host "ffmpeg 打包验证通过"

      - name: Copy user manual into dist
        shell: cmd
        run: copy /y "使用手册.html" "dist\win-rec\使用手册.html"

      - name: Package zip
        shell: pwsh
        run: Compress-Archive -Path dist\win-rec\* -DestinationPath dist\win-rec-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: win-rec-windows
          path: dist\win-rec-windows.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist\win-rec-windows.zip
          body: |
            ## 安装说明

            1. 下载 `win-rec-windows.zip`
            2. 解压到任意文件夹
            3. 命令行方式：在该文件夹内打开 cmd，运行 `win-rec.exe start`
            4. 托盘方式：双击 `tray.exe`，系统托盘出现图标后右键操作

            详细说明请参阅 README.md。
